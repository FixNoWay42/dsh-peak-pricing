# Minimal cordis.yml for @deepseek-ai/dsh-peak-pricing.
# Mount this file in a deepseek-harness (dsh) deployment; the LLM seam,
# session, system prompt, tools, agent, and agent loop come from the host.
# The preset names a provider route the host has registered (here: mock).

- name: '@deepseek-ai/dsh-llm'

- name: '@deepseek-ai/dsh-session'

- name: '@deepseek-ai/dsh-system-prompt'

- name: '@deepseek-ai/dsh-tools'

- name: '@deepseek-ai/dsh-agent'

- name: '@deepseek-ai/dsh-peak-pricing'
  config:
    timezone: Asia/Shanghai
    peakWindows:
      - start: '09:00'
        end: '12:00'
      - start: '14:00'
        end: '18:00'
    effectiveFrom: '2026-08-17T00:00:00+08:00'
    peak:
      provider: mock
      model: peak-chat

- name: '@deepseek-ai/dsh-agent-loop'
