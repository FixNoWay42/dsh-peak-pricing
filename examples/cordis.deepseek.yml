# Full cordis.yml for @deepseek-ai/dsh-peak-pricing with a real DeepSeek
# adapter. Mount this file in a deepseek-harness (dsh) deployment; the LLM
# seam, session, system prompt, tools, agent, and agent loop come from the
# host. Requires a DEEPSEEK_API_KEY in the host environment.

- name: '@deepseek-ai/dsh-llm'

- name: '@deepseek-ai/dsh-session'

- name: '@deepseek-ai/dsh-system-prompt'

- name: '@deepseek-ai/dsh-tools'

- name: '@deepseek-ai/dsh-agent'

- name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    retryPolicy:
      mode: normal

- name: '@deepseek-ai/dsh-peak-pricing'
  config:
    # Peak windows are expressed in this IANA timezone's local wall clock.
    timezone: Asia/Shanghai
    # Beijing-time peak-price windows: 09:00-12:00 and 14:00-18:00.
    peakWindows:
      - start: '09:00'
        end: '12:00'
      - start: '14:00'
        end: '18:00'
    # The new half-price-off-peak tariff starts 2026-08-17 00:00 Beijing.
    # Before this instant the switch never engages; omit it to enable now.
    effectiveFrom: '2026-08-17T00:00:00+08:00'
    peak:
      provider: deepseek
      model: deepseek-v4-flash
      # Optional: force a reasoning effort inside peak windows. When absent,
      # any inherited reasoning effort is dropped and provider defaults apply.
      # reasoningEffort: low
    # Optional: per-model tariff overrides, merged over the built-in DeepSeek
    # tariff (deepseek-v4-flash / deepseek-v4-pro). Used for estimation and
    # logging only; the switch itself keys on the peak windows above. Omit
    # the key to use the built-in table alone.
    # tariff:
    #   my-custom-model:
    #     peak:
    #       inputCacheHit: 0.5
    #       input: 4.0
    #       output: 12.0
    #     offPeak:
    #       inputCacheHit: 0.25
    #       input: 2.0
    #       output: 6.0

- name: '@deepseek-ai/dsh-agent-loop'
